name: Preview builds
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gdiretc-idm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "Windows x64", os: windows-2025, platform: "windows/amd64", resource: windows-amd64}
          - {label: "macOS Apple Silicon", os: macos-15, platform: "darwin/arm64", resource: darwin-arm64}
          - {label: "macOS Intel", os: macos-15-intel, platform: "darwin/amd64", resource: darwin-amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle verified upstream gdirect
        run: python scripts/prepare_helper.py --platform "${{ matrix.resource }}"
      - name: Install dependencies
        run: |
          go mod tidy
          bun install
      - name: Test Go packages
        run: go test ./... -count=1
      - name: Build desktop app and installer
        run: bun run build -- -platform "${{ matrix.platform }}"
      - name: Preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdiretc-idm-${{ matrix.resource }}
          path: build/
          retention-days: 14
          if-no-files-found: error

  publish-preview:
    name: Publish preview release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gdiretc-idm-*
          path: artifact-packages
      - name: Prepare installer assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifact-packages -type f \( -name '*.dmg' -o -name '*setup*.exe' \) -print -exec cp -v {} release-files/ \;
          count=$(find release-files -type f | wc -l)
          test "$count" -ge 3 || { echo "Expected Windows + two macOS installers"; exit 1; }
          cd release-files
          sha256sum * > SHA256SUMS
      - name: Publish a prerelease for manual testing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="preview-${GITHUB_SHA:0:7}"
          gh release create "$tag" release-files/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "gdirect IDM preview (${GITHUB_SHA:0:7})" \
            --notes "Unsigned development preview: Windows x64, macOS Apple Silicon and Intel. Only publicly downloadable Google Drive files; no OAuth needed. Real-world direct IP reachability has not yet been validated. macOS Gatekeeper and Windows SmartScreen may warn. gdirect (GPL-2.0-or-later) source: https://github.com/mizorewww/gdirect/tree/v0.13.2"
