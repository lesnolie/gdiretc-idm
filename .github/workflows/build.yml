name: Preview builds
on:
  push:
    branches: [main, feat/portable-tactile-v03]
  workflow_dispatch:

concurrency:
  group: gdiretc-idm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "Windows x64", os: windows-2025, platform: "windows/amd64", resource: windows-amd64}
          - {label: "macOS Apple Silicon", os: macos-15, platform: "darwin/arm64", resource: darwin-arm64}
          - {label: "macOS Intel", os: macos-15-intel, platform: "darwin/amd64", resource: darwin-amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate geometric G icons
        run: go run ./cmd/genicon
      - name: Bundle verified upstream gdirect
        run: python scripts/prepare_helper.py --platform "${{ matrix.resource }}"
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Run unit tests
        run: go test ./... -count=1
      - name: Build MyGo Native UI without installers
        run: go tool mygo build -skip-installer -skip-dmg -platform "${{ matrix.platform }}"
      - name: Package portable ZIP
        run: python scripts/package_portable.py --platform "${{ matrix.resource }}"
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gdiretc-idm-${{ matrix.resource }}
          path: portable/*.zip
          retention-days: 14
          if-no-files-found: error

  publish-preview:
    if: github.ref == 'refs/heads/main'
    name: Publish portable preview
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gdiretc-idm-*
          path: artifact-packages
      - name: Collect portable archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files
          find artifact-packages -type f -name '*.zip' -exec cp -v {} release-files/ \;
          test "$(find release-files -type f | wc -l)" -ge 3
          cd release-files
          sha256sum * > SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="preview-${GITHUB_SHA:0:7}"
          gh release create "$tag" release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "gdirect IDM Native Portable v0.3 Preview" \
            --notes "PORTABLE ONLY: extract Windows ZIP and run EXE; extract Mac ZIP and open .app. No Setup installer, no DMG. MyGo Native UI with neutral tactile button states, right-click/remove, progress, tray, and gdirect anonymous public-file downloads. Windows builds may display SmartScreen; unsigned/unnotarized macOS preview may need Open Anyway. End-to-end transfers still require device testing."
